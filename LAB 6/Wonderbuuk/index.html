<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">

        <!-- Quiz Header -->
        <header>
            <h1>JavaScript Quiz</h1>
            <p>Test your knowledge of JavaScript!</p>
        </header>

        <!-- Start Section -->
        <div id="start-screen">
            <h2>Welcome to the Quiz!</h2>
            <p>Answer the questions before the timer runs out.</p>
            <button id="start-btn" onclick="startQuiz()">Start Quiz</button>
        </div>

        <!-- Quiz Section -->
        <div id="quiz-screen" style="display: none;">

            <div class="quiz-info">
                <p id="question-number">Question 1</p>
                <p id="timer">Time: 15s</p>
            </div>

            <div class="timer-bar">
                <div id="timer-progress"></div>
            </div>

            <h2 id="question">Question appears here</h2>

            <div id="answer-options"></div>

            <div id="feedback"></div>

            <button id="submit-btn" onclick="checkAnswer()">
                Submit Answer
            </button>

            <button id="next-btn" onclick="nextQuestion()" style="display: none;">
                Next Question
            </button>

        </div>

        <!-- Result Section -->
        <div id="result-screen" style="display: none;">
            <h2>Quiz Completed!</h2>
            <p id="final-score"></p>
            <p id="result-message"></p>
            <button onclick="startQuiz()">Try Again</button>
        </div>

        <!-- Footer -->
        <footer>
            <p>JavaScript Quiz Application</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
